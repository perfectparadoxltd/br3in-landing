<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>BR3IN — discontinued</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0a0a0b;
      color: #e7e7ea;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      line-height: 1.6;
    }
    .wrap { max-width: 480px; }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    p { color: #9a9aa2; font-size: 1.05rem; margin-bottom: 1.75rem; }
    a {
      display: inline-block;
      color: #0a0a0b;
      background: #e7e7ea;
      text-decoration: none;
      font-weight: 600;
      padding: 0.7rem 1.4rem;
      border-radius: 10px;
      transition: opacity 0.2s ease;
    }
    a:hover { opacity: 0.85; }
    .small { margin-top: 2.5rem; font-size: 0.85rem; color: #5a5a62; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>BR3IN is no longer available.</h1>
    <p>This project has been discontinued. Thank you to everyone who followed along.</p>
    <a href="https://perfectparadox.co.uk">Perfect Paradox &rarr;</a>
    <div class="small">© 2026 Perfect Paradox Ltd · NI739317</div>
  </div>
</body>
</html>
